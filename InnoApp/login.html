<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Secure Print sign in</title>
  <style>
    body { font: 16px system-ui; margin: 0; background: #f3f4f6; }
    main { max-width: 420px; margin: 10vh auto; padding: 2rem; background: white; border-radius: 12px; }
    form { display: grid; gap: 0.75rem; }
    input, button { padding: 0.7rem; font: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Secure Print workstation</h1>
    <p>Sign in to retrieve only the documents owned by this account.</p>
    <form id="loginForm">
      <label for="phoneNumber">Phone number</label>
      <input id="phoneNumber" type="tel" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" maxlength="128" required>
      <button type="submit">Sign in</button>
      <p id="status" role="alert"></p>
    </form>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
